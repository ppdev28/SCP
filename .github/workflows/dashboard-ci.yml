name: dashboard-ci

on:
  push:
    branches: [feature/project-foundation]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/project-foundation
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Format check
        working-directory: frontend
        run: pnpm exec oxfmt --check
      - name: Typecheck
        working-directory: frontend
        run: pnpm exec tsc -b --pretty false
      - name: Show parser context
        if: failure()
        shell: bash
        run: |
          nl -ba frontend/src/App.tsx | sed -n '318,340p'
          nl -ba frontend/src/views/DashboardView.tsx | sed -n '270,290p'
          nl -ba frontend/src/lib/api.ts | sed -n '38,48p'
