name: dashboard-build-fix

on:
  push:
    branches: [feature/project-foundation]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/project-foundation
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Apply type fixes and connect dashboard
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          app = Path('frontend/src/App.tsx')
          source = app.read_text()
          import_line = 'import SettingsView from "./views/SettingsView";'
          dashboard_import = 'import RealDashboardView from "./views/DashboardView";'
          if dashboard_import not in source:
              source = source.replace(import_line, import_line + "\n" + dashboard_import, 1)
          pattern = re.compile(r'\{view === "dashboard" && \(\s*<DashboardView onNavigate=\{navigate\} addToast=\{addToast\} />\s*\)\}\s*\{\" \"\}')
          source, count = pattern.subn('{view === "dashboard" && <RealDashboardView onNavigate={navigate} addToast={addToast} />} {" "}', source, count=1)
          if count != 1:
              raise SystemExit(f'dashboard render replacement count: {count}')
          app.write_text(source)

          applications = Path('frontend/src/views/ApplicationsView.tsx')
          source = applications.read_text()
          source = source.replace(
              "const APP_CATALOG = [",
              "type CatalogApp = { name: string; desc: string; cat: string; icon: string }\n\nconst APP_CATALOG: CatalogApp[] = [",
              1,
          )
          old = """  const filtered = useMemo(() => {\n    if (tab === 'available') return APP_CATALOG.filter(a => (cat === 'All' || a.cat === cat) && (!query || [a.name, a.desc, a.cat].some(v => normalize(v).includes(query))))\n    return apps.filter(a => {\n      const matchesCategory = cat === 'All' || a.category === cat\n      if (!matchesCategory) return false\n      if (!query) return true\n      return [a.name, a.description, a.category, a.version, a.status, a.id].some(v => normalize(v).includes(query))\n    })\n  }, [apps, cat, query, tab])"""
          new = """  const filteredInstalled = useMemo(() => apps.filter(app => {\n    const matchesCategory = cat === 'All' || app.category === cat\n    if (!matchesCategory) return false\n    if (!query) return true\n    return [app.name, app.description, app.category, app.version, app.status, app.id].some(value => normalize(value).includes(query))\n  }), [apps, cat, query])\n\n  const filteredAvailable = useMemo(() => APP_CATALOG.filter(app => (cat === 'All' || app.cat === cat) && (!query || [app.name, app.desc, app.cat].some(value => normalize(value).includes(query)))), [cat, query])"""
          if old not in source:
              raise SystemExit('Applications filtered block not found')
          source = source.replace(old, new, 1)
          source = source.replace('filtered.length === 0', 'filteredInstalled.length === 0', 1)
          source = source.replace('filtered.map(app => <div key={app.id}', 'filteredInstalled.map(app => <div key={app.id}', 1)
          source = source.replace('{filtered.map(app => <Card key={app.name}', '{filteredAvailable.map(app => <Card key={app.name}', 1)
          source = source.replace('onClick={e => { e.stopPropagation(); setSelected(app) }}', 'onClick={() => setSelected(app)}', 1)
          applications.write_text(source)

          monitoring = Path('frontend/src/views/MonitoringView.tsx')
          source = monitoring.read_text()
          old_formatter = "formatter={(v:number)=>[`${formatter?formatter(v):v.toFixed(1)}${unit}`,'']} labelFormatter={(v:number)=>new Date(v).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'})}"
          new_formatter = "formatter={v=>{const value=Number(v);return [`${formatter?formatter(value):value.toFixed(1)}${unit}`,'']}} labelFormatter={v=>new Date(Number(v)).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'})}"
          if old_formatter not in source:
              raise SystemExit('Monitoring formatter block not found')
          monitoring.write_text(source.replace(old_formatter, new_formatter, 1))
          PY
      - name: Install Prettier
        working-directory: frontend
        run: pnpm add -D prettier@3.6.2
      - name: Format frontend
        working-directory: frontend
        run: pnpm exec prettier --write "src/**/*.{ts,tsx}"
      - name: Build frontend
        working-directory: frontend
        run: pnpm build
      - name: Commit validated implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src frontend/package.json frontend/pnpm-lock.yaml frontend/.oxfmtrc.json
          git commit -m 'feat(dashboard): connect live server overview'
          git push origin HEAD:feature/project-foundation
      - name: Remove temporary workflows
        shell: bash
        run: |
          git rm .github/workflows/dashboard-format.yml .github/workflows/dashboard-ci.yml .github/workflows/dashboard-finalize.yml .github/workflows/dashboard-build-fix.yml
          git commit -m 'chore(dashboard): remove temporary build workflows'
          git push origin HEAD:feature/project-foundation
